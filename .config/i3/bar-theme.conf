# BAR THEME — edit this file to change the i3bar appearance quickly.
# JetBrainsMono Nerd Font is installed on this laptop. Change this single line
# to use another installed Nerd Font, for example Monocraft Nerd Font Mono.
set $bar_font pango:JetBrainsMono Nerd Font 10
set $bar_bg #101522
set $bar_fg #d5def1
set $bar_separator #536180
set $workspace_focused #b9a3ff
set $workspace_active #26334d
set $workspace_inactive #101522
set $workspace_urgent #ffa4b5

# SPACING — change these literal values to adjust the bar padding quickly.
# i3 requires numeric values here; variables are not accepted for these fields.
# tray_padding controls the space around system-tray icons.

# The whole bar lives here so font, height, colors and spacing stay together.
bar {
    status_command i3blocks -c ~/.config/i3blocks/config
    position bottom
    height 28
    workspace_min_width 24
    tray_output primary
    tray_padding 5
    font $bar_font

    colors {
        background $bar_bg
        statusline $bar_fg
        separator $bar_separator
        focused_workspace  $workspace_active $workspace_active $workspace_focused
        active_workspace   $workspace_active $workspace_inactive $bar_fg
        inactive_workspace $workspace_inactive $workspace_inactive $bar_separator
        urgent_workspace   $workspace_urgent $workspace_urgent $bar_bg
        binding_mode       $workspace_urgent $workspace_urgent $bar_bg
    }
}
