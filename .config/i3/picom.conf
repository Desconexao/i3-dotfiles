# Short workspace fades without changing opacity, shadows or window geometry.
backend = "xrender";
vsync = true;
shadow = false;
corner-radius = 0;
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 10;
# Keep application opening/closing immediate; fade workspace visibility changes.
no-fading-openclose = true;
fade-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'tooltip'",
    "class_g = 'Rofi'",
    "class_g = 'i3lock'"
];
